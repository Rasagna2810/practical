name:Student-api
on:
  push:
    branches:[main]
  pull_request:
    branches:[main]
jobs:
  build:
    runs-on:ubuntu-latest
    steps:
      -name:checkout repository
       uses:actions/checkout@v2
      -name:setup node
       uses:actions/setup-node@v2
       with:
         node-version:20
         cache: npm
      -name:install dependencies
       run:npm install
      -name:check server file
        run:node server.js
      